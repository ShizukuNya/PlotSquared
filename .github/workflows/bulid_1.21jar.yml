name: Build PlotSquared (MC 1.21)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x ./gradlew

      - name: Build Bukkit module
        run: ./gradlew clean :plotsquared-bukkit:build

      - name: List output (debug)
        run: ls -R Bukkit/build/libs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlotSquared-Bukkit-MC1.21
          path: Bukkit/build/libs/plotsquared-bukkit-*.jar
