name: Build PlotSquared (MC 1.21)

on:
  workflow_dispatch:   # ← 关键：允许网页/API 手动触发
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Bukkit jar
        run: ./gradlew clean :Bukkit:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlotSquared-Bukkit-MC1.21
          path: Bukkit/build/libs/plotsquared-bukkit-*-SNAPSHOT.jar
          retention-days: 30
