name: Build PlotSquared (MC 1.21)

on:
  workflow_dispatch:  # 支持网页手动点击"Run workflow"
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (MC 1.21 必需)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant Gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build plotsquared-bukkit module
        run: ./gradlew clean :plotsquared-bukkit:build  # 修正后的命令

      - name: Upload Bukkit plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PlotSquared-Bukkit-MC1.21
          path: plotsquared-bukkit/build/libs/plotsquared-bukkit-*-SNAPSHOT.jar
          retention-days: 30  # 产物保留30天，可自己改
